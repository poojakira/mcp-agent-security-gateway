title: Agent Credential Chain via MCP Tool Call
id: 8a3f2c91-4e7b-4d12-b6a1-9c2e8f3d7a4b
status: experimental
description: |
  Detects sequences where an MCP tool call is followed by sts:AssumeRole
  within 60 seconds, indicating an agent may be chaining credentials
  after a tool-call interaction. Common in agent compromise scenarios
  where the attacker uses tool-call injection to pivot to other roles.
references:
  - https://github.com/poojakira/mcp-agent-security-gateway
  - https://attack.mitre.org/techniques/T1078/004/
author: Pooja Kiran
date: 2026/08/18
tags:
  - attack.credential_access
  - attack.t1078.004
  - attack.t1550
logsource:
  product: aws
  service: cloudtrail
detection:
  tool_call_event:
    eventSource: mcp-gateway
    eventName: tool_call_decision
    decision: ALLOW
  assume_role_event:
    eventSource: sts.amazonaws.com
    eventName: AssumeRole
  timeframe: 60s
  condition: tool_call_event | followed_by assume_role_event
fields:
  - userIdentity.arn
  - requestParameters.roleArn
  - sourceIPAddress
  - eventTime
falsepositives:
  - Legitimate agent workflows that assume roles as part of normal operation.
    Baseline per-agent role assumption patterns before enabling.
level: high
