services:
  mcp-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MCP_ENV: production
      MCP_LISTEN_HOST: 0.0.0.0
      MCP_LISTEN_PORT: 8080
      MCP_SHADOW_MODE: "false"
      MCP_WEBHOOK_URL: ${MCP_WEBHOOK_URL:-}
      MCP_RATE_LIMIT_RPM: 600
      MCP_CIRCUIT_BREAKER_THRESHOLD: 5
      MCP_CIRCUIT_BREAKER_TIMEOUT: 30
      MCP_LOG_LEVEL: INFO
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_API_KEYS: ${MCP_API_KEYS:-}
      MCP_ALLOWED_SERVERS: ${MCP_ALLOWED_SERVERS:?set MCP_ALLOWED_SERVERS to approved comma-separated server IDs}
      MCP_MAX_PAYLOAD_KB: 512
      MCP_WAL_PATH: /var/lib/mcp/wal.jsonl
      MCP_AUDIT_PATH: /var/lib/mcp/audit.jsonl
      MCP_ALLOW_ANONYMOUS: "false"
      MCP_TRUSTED_PROXY_CIDRS: ${MCP_TRUSTED_PROXY_CIDRS:-}
      MCP_IDENTITY_TELEMETRY_ENABLED: ${MCP_IDENTITY_TELEMETRY_ENABLED:-false}
      MCP_IDENTITY_TELEMETRY_TENANT_SALT: ${MCP_IDENTITY_TELEMETRY_TENANT_SALT:-}
      MCP_IDENTITY_TELEMETRY_OUTPUT: /var/lib/mcp/identity-telemetry.ndjson
    volumes:
      - mcp-state:/var/lib/mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp-identity-shipper:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "mcp_monitor.production.identity_shipper"]
    profiles: ["identity-telemetry"]
    environment:
      MCP_IDENTITY_TELEMETRY_ENDPOINT: ${MCP_IDENTITY_TELEMETRY_ENDPOINT:-}
      MCP_IDENTITY_TELEMETRY_BEARER_TOKEN: ${MCP_IDENTITY_TELEMETRY_BEARER_TOKEN:-}
      MCP_IDENTITY_TELEMETRY_OUTPUT: /var/lib/mcp/identity-telemetry.ndjson
      MCP_IDENTITY_TELEMETRY_CURSOR: /var/lib/mcp/identity-telemetry.cursor
      MCP_IDENTITY_TELEMETRY_POLL_SECONDS: ${MCP_IDENTITY_TELEMETRY_POLL_SECONDS:-2}
      MCP_IDENTITY_TELEMETRY_MAX_BACKOFF_SECONDS: ${MCP_IDENTITY_TELEMETRY_MAX_BACKOFF_SECONDS:-60}
    volumes:
      - mcp-state:/var/lib/mcp
    depends_on:
      mcp-monitor:
        condition: service_healthy
    # The shipper is a queue worker and does not expose the gateway HTTP health endpoint.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  mcp-state:
