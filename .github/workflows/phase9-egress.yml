name: Phase 9 Internal Network and Egress Proxy Boundary

on:
  pull_request:
    branches:
      - phase8/durable-authority-sqlite-pilot
    paths:
      - "src/mcp_monitor/proxy/internal_sandbox.py"
      - "src/mcp_monitor/proxy/stdio_proxy.py"
      - "tests/test_phase9_internal_sandbox.py"
      - "tests/test_phase9_internal_docker.py"
      - "tests/fixtures/phase9_network_server.py"
      - "tests/fixtures/phase9_sidecar_fixture.py"
      - "tests/fixtures/Dockerfile.phase9"
      - ".github/workflows/phase9-egress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-network-regressions:
    name: Restricted internal network Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install free open-source test dependencies
        run: python -m pip install -e ".[dev,oidc]"
      - name: Ruff check
        run: |
          ruff check src/mcp_monitor/proxy/internal_sandbox.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase9_internal_sandbox.py tests/test_phase9_internal_docker.py tests/fixtures/phase9_network_server.py tests/fixtures/phase9_sidecar_fixture.py
          ruff format --check src/mcp_monitor/proxy/internal_sandbox.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase9_internal_sandbox.py tests/test_phase9_internal_docker.py tests/fixtures/phase9_network_server.py tests/fixtures/phase9_sidecar_fixture.py
      - name: Internal network negative tests
        run: python -m pytest tests/test_phase9_internal_sandbox.py -q --tb=short
      - name: Full repository regression suite
        run: python -m pytest tests/ -q --tb=short --cov=mcp_monitor --cov-report=term --cov-fail-under=77

  local-docker-integration:
    name: Real Docker internal-network isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,oidc]"
      - name: Build disposable image and dedicated internal-only bridge
        run: |
          docker build -f tests/fixtures/Dockerfile.phase9 -t phase9-synthetic:local .
          image_id=$(docker image inspect --format '{{.Id}}' phase9-synthetic:local)
          network_id=$(docker network create --internal --driver bridge phase9-egress-${{ github.run_id }})
          proxy_name=mcp-egress-synthetic-${{ github.run_id }}
          proxy_id=$(docker run -d --rm --network "$network_id" --name "$proxy_name" phase9-synthetic:local python -u /opt/phase9/sidecar.py)
          echo "PHASE9_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
          echo "PHASE9_NETWORK_ID=$network_id" >> "$GITHUB_ENV"
          echo "PHASE9_PROXY_ID=$proxy_id" >> "$GITHUB_ENV"
          echo "PHASE9_PROXY_NAME=$proxy_name" >> "$GITHUB_ENV"
      - name: Verify real isolated server and synthetic local sidecar
        run: python -m pytest tests/test_phase9_internal_docker.py -v --tb=short
      - name: Remove disposable resources
        if: always()
        run: |
          if [ -n "${PHASE9_PROXY_ID:-}" ]; then docker rm -f "$PHASE9_PROXY_ID" || true; fi
          if [ -n "${PHASE9_NETWORK_ID:-}" ]; then docker network rm "$PHASE9_NETWORK_ID" || true; fi
