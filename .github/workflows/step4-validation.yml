name: Step 4 Policy Validation

on:
  pull_request:
    branches:
      - fix/enforce-policy-in-stdio-proxy
    paths:
      - "src/mcp_monitor/policy/policy_engine.py"
      - "tests/test_step4_egress_validation.py"
      - "tests/test_step4_nested_egress.py"
      - ".github/workflows/step4-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-regression:
    name: Policy and Step 4 regressions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned lint tooling and gateway
        run: |
          python -m pip install ruff==0.8.4
          python -m pip install -e ".[dev]"
      - name: Check Ruff lint and formatting
        run: |
          ruff check src/mcp_monitor/policy/policy_engine.py tests/test_step4_egress_validation.py tests/test_step4_nested_egress.py
          ruff format --check src/mcp_monitor/policy/policy_engine.py tests/test_step4_egress_validation.py tests/test_step4_nested_egress.py
      - name: Run policy and Step 4 tests
        run: |
          python -m pytest tests/test_step4_egress_validation.py tests/test_step4_nested_egress.py tests/test_stdio_policy_integration.py tests/test_step2_security_boundaries.py -q --tb=short
