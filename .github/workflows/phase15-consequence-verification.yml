name: Phase 15 independent consequence verification

on:
  push:
    branches:
      - phase15/independent-consequence-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consequence-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install free local dependencies, no API key
        run: python -m pip install -e ".[dev,oidc]"
      - name: Check syntax and formatting of new verification boundary
        run: |
          ruff check src/mcp_monitor/protocol/consequence_verifier.py tests/test_phase15_consequence_verification.py
          ruff format --check src/mcp_monitor/protocol/consequence_verifier.py tests/test_phase15_consequence_verification.py
      - name: Test independent consequence proofs and real MCP lost ACK
        run: |
          python -m pytest tests/test_phase15_consequence_verification.py tests/test_phase11_effect_journal.py -v --tb=short -rs
      - name: Verify real Phase 14 protected MCP adapter still functions
        run: python -m pytest tests/test_first_party_protected_mcp.py tests/test_phase14_bypass_matrix.py -q --tb=short
      - name: Rebuild pinned-ID isolated Phase 14 MCP demonstrator
        run: |
          docker build -f Dockerfile.protected-mcp -t mcp-phase15-local:ci .
          image_id="$(docker image inspect mcp-phase15-local:ci --format '{{.Id}}')"
          case "$image_id" in sha256:*) ;; *) echo "Missing image ID"; exit 1;; esac
          echo "MCP_PHASE14_DOCKER_IMAGE=$image_id" >> "$GITHUB_ENV"
      - name: Verify real isolated MCP adapter remains independent
        run: python -m pytest tests/test_phase14_isolated_docker.py -v --tb=short -rs
