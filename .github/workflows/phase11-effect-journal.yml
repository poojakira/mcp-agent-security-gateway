name: Phase 11 Durable Side Effect Journal

on:
  pull_request:
    branches:
      - phase10/multiplexed-stdio-protocol
    paths:
      - "src/mcp_monitor/protocol/effect_journal.py"
      - "src/mcp_monitor/proxy/stdio_proxy.py"
      - "tests/test_phase11_effect_journal.py"
      - ".github/workflows/phase11-effect-journal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-effect-journal:
    name: Side effect recovery (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install free testing dependencies
        run: python -m pip install -e ".[dev,oidc]"
      - name: Show final formatter difference (temporary)
        run: ruff format --diff tests/test_phase11_effect_journal.py || true
      - name: Ruff lint and formatting
        run: |
          ruff check src/mcp_monitor/protocol/effect_journal.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase11_effect_journal.py
          ruff format --check src/mcp_monitor/protocol/effect_journal.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase11_effect_journal.py
      - name: Focused journal and protocol regressions
        run: python -m pytest tests/test_phase11_effect_journal.py tests/test_phase10_multiplex.py tests/test_stdio_policy_integration.py -q --tb=short
      - name: Full repository suite
        run: python -m pytest tests/ -q --tb=short --cov=mcp_monitor --cov-report=term --cov-fail-under=77
