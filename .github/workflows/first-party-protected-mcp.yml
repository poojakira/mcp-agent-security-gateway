name: First-party protected MCP real-process verification

on:
  pull_request:
    branches:
      - phase13/release-readiness-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install free, open-source development dependencies
        run: python -m pip install -e ".[dev,oidc]"
      - name: Lint the protected server and real-process tests
        run: |
          ruff check src/mcp_monitor/protected_repo_server.py tests/test_first_party_protected_mcp.py
          ruff format --diff src/mcp_monitor/protected_repo_server.py tests/test_first_party_protected_mcp.py || true
          ruff format --check src/mcp_monitor/protected_repo_server.py tests/test_first_party_protected_mcp.py
      - name: Real MCP server process through the actual gateway
        run: python -m pytest tests/test_first_party_protected_mcp.py -q -s --tb=short
      - name: Gateway policy and protocol regressions
        run: python -m pytest tests/test_stdio_policy_integration.py tests/test_stdio_adversarial_responses.py tests/test_protocol_hardening.py -q --tb=short
