name: Phase 1-16 public external prompt-injection diagnostic

on:
  push:
    branches:
      - benchmark/phase1-16-public-corpus-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-regex-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install public local dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint and test benchmark harness
        run: |
          ruff check benchmark/external_public_eval.py tests/test_external_public_benchmark.py
          ruff format --diff benchmark/external_public_eval.py tests/test_external_public_benchmark.py
          ruff format --check benchmark/external_public_eval.py tests/test_external_public_benchmark.py
          python -m pytest tests/test_external_public_benchmark.py -q
      - name: Fetch independently authored MIT-labeled corpus at exact Git commit
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/stef41/prompt-injection-benchmark/dc0072ad6af8d1be049cdb60959e3ff51df4bcae/data.csv"
          curl --fail --show-error --silent --location --retry 2 --max-time 30 "$url" -o /tmp/mcp-external-corpus.csv
          actual="$(git hash-object /tmp/mcp-external-corpus.csv)"
          expected="17d2c521a6b7a5ebd7f68e768fd334cd97897a4e"
          test "$actual" = "$expected" || { echo "Pinned corpus hash mismatch"; exit 1; }
          echo "External corpus integrity verified against upstream Git blob: $actual"
      - name: Measure confusion matrix without retuning detector
        run: |
          python -m benchmark.external_public_eval /tmp/mcp-external-corpus.csv --mode regex_only --output /tmp/mcp-external-evaluation.json
          python -m benchmark.external_public_eval /tmp/mcp-external-corpus.csv --mode local_hybrid --output /tmp/mcp-external-hybrid-evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/mcp-external-evaluation.json").read_text())
          totals = result["metrics"]
          assert sum(totals[k] for k in ("tp", "tn", "fp", "fn")) == result["count"]
          assert result["count"] >= 250
          print("Measured, not certified; full baseline in artifact")
          PY
      - name: Preserve free diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-regex-benchmark
          path: |
            /tmp/mcp-external-evaluation.json
            /tmp/mcp-external-hybrid-evaluation.json
          if-no-files-found: warn
          retention-days: 7
