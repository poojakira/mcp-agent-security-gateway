name: Documentation Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Reject unresolved placeholders and merge conflicts
        shell: python
        run: |
          from pathlib import Path

          candidates = [
              Path("README.md"), Path("SECURITY.md"), Path("RUNBOOK.md"),
              Path("PRODUCTION.md"), Path("THREAT_MODEL.md"),
          ]
          forbidden = ("<<<<<<<", "=======", ">>>>>>>", "TODO: FILL", "TBD_METRIC")
          failures = []
          for path in candidates:
              if not path.is_file():
                  continue
              body = path.read_text(encoding="utf-8", errors="replace")
              for marker in forbidden:
                  if marker in body:
                      failures.append(f"{path}: unresolved marker {marker!r}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("documentation integrity verified; honest research/prototype/limitation wording is allowed")
