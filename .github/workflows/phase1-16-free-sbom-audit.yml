name: Phase 1-16 free Python supply-chain evidence

on:
  push:
    branches:
      - security/phase1-16-sbom-audit-20261110
      - security/phase1-16-protected-image-deps-20261110
      - docs/phase1-16-evidence-and-poster-20261111
      - security/phase1-16-pin-image-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install project and free public security tooling
        run: |
          python -m pip install -e ".[dev,oidc]"
          python -m pip install "pip-audit>=2.7,<4" "cyclonedx-bom>=6,<8"
      - name: Generate reproducible installed-environment CycloneDX SBOM
        run: |
          cyclonedx-py environment --output-format JSON --output-reproducible --output-file /tmp/mcp-sbom.json
          python - <<'PY'
          import json
          from pathlib import Path
          sbom = json.loads(Path("/tmp/mcp-sbom.json").read_text())
          assert sbom["bomFormat"] == "CycloneDX"
          assert sbom.get("components")
          print("Generated validated CycloneDX SBOM; installed components:", len(sbom["components"]))
          PY
      - name: Fail on publicly reported Python dependency vulnerabilities
        run: |
          python -m pip_audit --format json --output /tmp/mcp-pip-audit.json
      - name: Preserve SBOM and audit report as GitHub Actions evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase1-16-python-sbom-audit
          path: |
            /tmp/mcp-sbom.json
            /tmp/mcp-pip-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Record exact workflow source and residual limits
        if: always()
        run: |
          echo "Source commit: $GITHUB_SHA"
          echo "This job checks the installed Python environment and public advisories only."
          echo "Not checked: Docker image packages, unpublished vulnerabilities, malicious build scripts, license approvals or deployed services."
