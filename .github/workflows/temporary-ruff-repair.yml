name: Temporary Ruff formatting repair

on:
  push:
    branches:
      - fix/enforce-policy-in-stdio-proxy
    paths:
      - .github/workflows/temporary-ruff-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'poojakira/mcp-agent-security-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/enforce-policy-in-stdio-proxy
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Format only the four CI-reported files
        run: |
          python -m pip install --disable-pip-version-check ruff==0.8.4
          ruff format src/mcp_monitor/policy/acl_guard.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_acl_guard.py tests/test_live_filesystem_mcp.py
          ruff format --check src/mcp_monitor/policy/acl_guard.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_acl_guard.py tests/test_live_filesystem_mcp.py
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/mcp_monitor/policy/acl_guard.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_acl_guard.py tests/test_live_filesystem_mcp.py
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style: apply Ruff 0.8.4 to ACL and stdio proxy files"
          git push origin HEAD:fix/enforce-policy-in-stdio-proxy
