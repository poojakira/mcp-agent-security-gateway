name: Phase 13 Release Readiness (NO-GO until remediated)

on:
  pull_request:
    branches:
      - phase12/frozen-adversarial-benchmark
      - main
    paths:
      - "docker-compose*.yml"
      - "src/mcp_monitor/**"
      - "tests/**"
      - "pyproject.toml"
      - "scripts/workflow_security_scan.py"
      - "docs/review/PHASE13*.md"
      - ".github/workflows/phase13-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-regression:
    name: Full suite Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install -e ".[dev,oidc]"
      - name: Lint release gate
        run: |
          ruff check tests/test_phase13_release_gate.py tests/test_phase13_retired_credential.py
          ruff format --check tests/test_phase13_release_gate.py tests/test_phase13_retired_credential.py
      - name: Run inherited regression suite
        run: python -m pytest tests/ --ignore=tests/test_phase13_release_gate.py --ignore=tests/test_phase13_retired_credential.py -q --tb=short --cov=mcp_monitor --cov-report=term --cov-fail-under=77
      - name: Enforce lab configuration release gate
        run: python -m pytest tests/test_phase13_release_gate.py tests/test_phase13_retired_credential.py -q --tb=short

  real-mcp-integration:
    name: Real filesystem MCP / config / deny-before-effect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install free test dependencies
        run: python -m pip install -e ".[dev,oidc]"
      - name: Security-sensitive source and workflow lint
        run: |
          ruff check src/mcp_monitor/proxy/stdio_proxy.py src/mcp_monitor/production/config.py tests/test_live_filesystem_mcp.py
          ruff format --check src/mcp_monitor/proxy/stdio_proxy.py src/mcp_monitor/production/config.py tests/test_live_filesystem_mcp.py
          python scripts/workflow_security_scan.py
      - name: Validate hardened local lab Compose without printing a credential
        run: |
          export MCP_API_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          docker compose -f docker-compose.detection-lab.yml config --quiet
      - name: Explicit negative authorization and side-effect regressions
        run: |
          python -m pytest tests/test_stdio_policy_integration.py tests/test_stdio_inflight_revocation.py tests/test_stdio_adversarial_responses.py tests/test_acl_guard.py tests/test_phase11_effect_journal.py -q --tb=short
      - name: Actual pinned MCP filesystem server; no mocks
        env:
          MCP_RUN_REAL_SERVER: "1"
        run: python -m pytest tests/test_live_filesystem_mcp.py -v -s --tb=short -rs
      - name: Verify installed Python dependency consistency
        run: python -m pip check
      - name: Build nonproduction Docker image and verify fail-closed startup config
        shell: bash
        run: |
          docker build --tag mcp-gateway-phase13:ci .
          test "$(docker image inspect mcp-gateway-phase13:ci --format '{{.Config.User}}')" = "mlsec"
          if output="$(docker run --rm --network none -e MCP_ENV=production --entrypoint python mcp-gateway-phase13:ci -c 'from mcp_monitor.production.config import Config; Config()' 2>&1)"; then
            echo "FAIL: missing security configuration allowed startup"
            exit 1
          fi
          if ! grep -Fq "Invalid production configuration" <<< "$output"; then
            echo "FAIL: container process exited for a reason other than expected security validation"
            exit 1
          fi
          echo "Missing production security settings rejected, as expected"

  supply-chain-evidence:
    name: Free dependency audit, Bandit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package and free security assessment tools
        run: |
          python -m pip install -e ".[dev,oidc]"
          python -m pip install pip-audit==2.10.1 bandit==1.8.3 cyclonedx-bom==5.1.1
          python -m pip check
      - name: Static security assessment
        run: |
          bandit -r src -ll -f json -o bandit-report.json
          python .github/scripts/check_bandit.py
      - name: Public dependency vulnerability audit (no API key)
        run: |
          pip-audit --skip-editable --format json --output pip-audit.json
          python .github/scripts/check_pip_audit.py
      - name: Generate software bill of materials
        run: cyclonedx-py environment --output-format JSON --outfile sbom.json
      - name: Upload restricted-retention security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase13-supply-chain-evidence
          path: |
            bandit-report.json
            pip-audit.json
            sbom.json
          retention-days: 7
          if-no-files-found: warn
