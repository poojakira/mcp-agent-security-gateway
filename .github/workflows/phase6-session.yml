name: Phase 6 Trusted Session Validation

on:
  pull_request:
    branches:
      - phase5/offline-docker-egress-isolation
    paths:
      - "src/mcp_monitor/proxy/session_identity.py"
      - "src/mcp_monitor/proxy/stdio_proxy.py"
      - "tests/test_phase6_session_identity.py"
      - ".github/workflows/phase6-session.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-authorization:
    name: Signed session isolation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local dependencies
        run: python -m pip install -e ".[dev]"
      - name: Print exact Ruff formatting differences (temporary)
        run: |
          ruff format --diff src/mcp_monitor/proxy/session_identity.py tests/test_phase6_session_identity.py || true
      - name: Lint and format changed source
        run: |
          ruff check src/mcp_monitor/proxy/session_identity.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase6_session_identity.py
          ruff format --check src/mcp_monitor/proxy/session_identity.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase6_session_identity.py
      - name: Signed identity and existing security boundary tests
        run: |
          python -m pytest tests/test_phase6_session_identity.py tests/test_step4_authoritative_acl.py tests/test_stdio_policy_integration.py -q --tb=short
      - name: Full regression suite with coverage
        run: |
          python -m pytest tests/ -q --tb=short --cov=mcp_monitor --cov-report=term --cov-fail-under=77
