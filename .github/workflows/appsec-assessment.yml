name: Authorized AppSec Assessment

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/appsec-assessment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appsec-assessment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-control-plane:
    name: MCP control-plane security assessment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install assessment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Run authorized AppSec regression assessment
        env:
          PYTHONPATH: src
        run: |
          pytest -q             tests/test_http_framing.py             tests/test_protocol_hardening.py             tests/test_policy_enforcement.py             tests/test_production.py             --tb=short
