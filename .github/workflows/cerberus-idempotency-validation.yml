name: Cerberus Idempotency Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      CERBERUS_ENDPOINT: https://api.cerberushq.dev/v1/events

    steps:
      - name: Checkout audited source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build gateway image
        run: docker build -t mcp-gateway:idempotency .

      - name: Generate one immutable envelope and submit it twice
        shell: bash
        env:
          CERBERUS_TOKEN: ${{ secrets.CERBERUS_PILOT_TOKEN }}
          CERBERUS_SALT: ${{ secrets.CERBERUS_PILOT_SALT }}
        run: |
          set -euo pipefail

          if [ -z "$CERBERUS_TOKEN" ] || [ -z "$CERBERUS_SALT" ]; then
            echo "cerberus_preflight=missing_secret"
            exit 1
          fi
          echo "::add-mask::$CERBERUS_TOKEN"
          echo "::add-mask::$CERBERUS_SALT"
          echo "cerberus_preflight=ready"

          RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$RUNTIME_DIR"
          cleanup() {
            docker rm -f mcp-idempotency >/dev/null 2>&1 || true
            rm -rf "$RUNTIME_DIR"
          }
          trap cleanup EXIT

          KEY_A="$(openssl rand -hex 32)"
          KEY_B="$(openssl rand -hex 32)"
          KEY_C="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY_A"
          echo "::add-mask::$KEY_B"
          echo "::add-mask::$KEY_C"

          docker run -d --name mcp-idempotency             -p 127.0.0.1:8080:8080             -e MCP_ENV=production             -e MCP_LISTEN_HOST=0.0.0.0             -e MCP_LISTEN_PORT=8080             -e MCP_API_KEYS="$KEY_A,$KEY_B,$KEY_C"             -e MCP_ALLOWED_SERVERS=github,filesystem             -e MCP_ALLOW_ANONYMOUS=false             -e MCP_WAL_PATH=/var/lib/mcp/wal.jsonl             -e MCP_AUDIT_PATH=/var/lib/mcp/audit.jsonl             -e MCP_IDENTITY_TELEMETRY_ENABLED=true             -e MCP_IDENTITY_TELEMETRY_TENANT_SALT="$CERBERUS_SALT"             -e MCP_IDENTITY_TELEMETRY_OUTPUT=/var/lib/mcp/identity-telemetry.ndjson             mcp-gateway:idempotency >/dev/null

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/v1/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true

          request() {
            curl -fsS -o /dev/null               -X POST "http://127.0.0.1:8080$2"               -H "X-API-Key: $1"               -H "Content-Type: application/json"               --data "$3"
          }

          request "$KEY_A" /v1/inspect_call '{"name":"read_file","server_id":"github","arguments":{"path":"README.md"}}'
          request "$KEY_B" /v1/inspect_output '{"tool_name":"read_file","output":{"content":"idempotency-validation"}}'
          request "$KEY_C" /v1/inspect_call '{"name":"list_directory","server_id":"filesystem","arguments":{"path":"."}}'

          docker cp mcp-idempotency:/var/lib/mcp/identity-telemetry.ndjson "$RUNTIME_DIR/queue.ndjson"

          QUEUE_PATH="$RUNTIME_DIR/queue.ndjson" OUT_PATH="$RUNTIME_DIR/envelope.json" python - <<'PY'
          import json, os
          from pathlib import Path
          from mcp_monitor.production.identity_transport import load_three_credential_smoke_batch

          batch = load_three_credential_smoke_batch(os.environ["QUEUE_PATH"])
          Path(os.environ["OUT_PATH"]).write_bytes(
              json.dumps(batch, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          )
          print("immutable_envelope_event_count=3")
          print("immutable_envelope_preserved=true")
          PY

          ENVELOPE_PATH="$RUNTIME_DIR/envelope.json" \
          FIRST_PATH="$RUNTIME_DIR/first.json" \
          SECOND_PATH="$RUNTIME_DIR/second.json" \
          STATUS_PATH="$RUNTIME_DIR/status.json" \
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path

          endpoint = os.environ["CERBERUS_ENDPOINT"]
          token = os.environ["CERBERUS_TOKEN"].strip()
          envelope_path = Path(os.environ["ENVELOPE_PATH"])
          raw = envelope_path.read_bytes()

          # Validate the exact bytes before any network call.
          parsed = json.loads(raw.decode("utf-8"))
          if len(parsed.get("events", [])) != 3 or len(parsed.get("event_fps", [])) != 3:
              raise SystemExit("immutable envelope does not contain exactly three events/fingerprints")
          print("immutable_envelope_json_valid=true")
          print("immutable_envelope_bytes=" + str(len(raw)))

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def send(method, url, body=None):
              req = urllib.request.Request(
                  url,
                  data=body,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      **({"Content-Type": "application/json"} if body is not None else {}),
                  },
              )
              try:
                  with opener.open(req, timeout=30) as resp:
                      return int(resp.status), resp.read(65536).decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  return int(exc.code), exc.read(65536).decode("utf-8", errors="replace")

          first_http, first_raw = send("POST", endpoint, raw)
          second_http, second_raw = send("POST", endpoint, raw)
          status_http, status_raw = send("GET", "https://api.cerberushq.dev/v1/status")

          Path(os.environ["FIRST_PATH"]).write_text(first_raw, encoding="utf-8")
          Path(os.environ["SECOND_PATH"]).write_text(second_raw, encoding="utf-8")
          Path(os.environ["STATUS_PATH"]).write_text(status_raw, encoding="utf-8")

          sensitive = re.compile(r"(token|secret|salt|authorization|password|api[_-]?key|credential)", re.I)

          def parse(value):
              try:
                  return json.loads(value) if value else None
              except json.JSONDecodeError:
                  return {"unparsed": value[:2000]}

          def scrub(v):
              if isinstance(v, dict):
                  return {k: ("<redacted>" if sensitive.search(str(k)) else scrub(x)) for k, x in v.items()}
              if isinstance(v, list):
                  return [scrub(x) for x in v]
              return v

          first = parse(first_raw)
          second = parse(second_raw)
          status = parse(status_raw)

          print("first_http=" + str(first_http))
          print("first_body=" + json.dumps(scrub(first), separators=(",", ":")))
          print("retry_http=" + str(second_http))
          print("retry_body=" + json.dumps(scrub(second), separators=(",", ":")))
          print("status_http=" + str(status_http))
          print("status_body=" + json.dumps(scrub(status), separators=(",", ":")))

          if first_http != 202:
              raise SystemExit("first submission was not HTTP 202")
          if second_http != 202:
              raise SystemExit("retry was not HTTP 202")
          if not isinstance(first, dict) or first.get("stored") != 3:
              raise SystemExit("first submission did not store exactly 3 events")
          if not isinstance(second, dict) or second.get("stored") != 0 or second.get("deduplicated") != 3:
              raise SystemExit("retry did not deduplicate exactly 3 events with zero new stores")

          print("idempotency_verified=true")
          PY
