name: Development package gate (production NO-GO)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip build
      - name: Install
        run: python -m pip install -e ".[dev,server,oidc]"
      - name: Verify human production release still blocked
        run: |
          grep -q 'NO-GO' docs/review/PHASE13_RELEASE_READINESS.md
          grep -q 'PRODUCTION NO-GO' docs/review/ADVERSARIAL_AUTOPSY_2026-11-14.md
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Static quality gate
        run: python -m ruff check src tests
      - name: Build/release smoke check
        run: python -m build
