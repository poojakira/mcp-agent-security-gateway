name: Real MCP Filesystem Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - "src/mcp_monitor/**"
      - "tests/test_live_filesystem_mcp.py"
      - ".github/workflows/real-mcp-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-filesystem-server:
    name: Real Filesystem MCP Server
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install gateway
        run: python -m pip install -e ".[dev]"
      - name: Test real filesystem server with disposable files
        env:
          MCP_RUN_REAL_SERVER: "1"
        run: python -m pytest tests/test_live_filesystem_mcp.py -v -s --tb=short
