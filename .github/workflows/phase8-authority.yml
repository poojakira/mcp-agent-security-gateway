name: Phase 8 Durable Local Authorization

on:
  pull_request:
    branches:
      - phase7/oidc-offline-jwks-and-revocation
    paths:
      - "src/mcp_monitor/policy/durable_authority.py"
      - "tests/test_phase8_durable_authority.py"
      - ".github/workflows/phase8-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-permissions:
    name: Durable local authority (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local test dependencies only
        run: python -m pip install -e ".[dev,oidc]"
      - name: Show precise Ruff formatting diff (temporary)
        run: |
          ruff format --diff src/mcp_monitor/policy/durable_authority.py tests/test_phase8_durable_authority.py || true
      - name: Lint and format
        run: |
          ruff check src/mcp_monitor/policy/durable_authority.py tests/test_phase8_durable_authority.py
          ruff format --check src/mcp_monitor/policy/durable_authority.py tests/test_phase8_durable_authority.py
      - name: Test multi-process durable ACLs and proxy revocation
        run: python -m pytest tests/test_phase8_durable_authority.py tests/test_step4_authoritative_acl.py -q --tb=short
      - name: Complete repository regression coverage
        run: python -m pytest tests/ -q --tb=short --cov=mcp_monitor --cov-report=term --cov-fail-under=77
