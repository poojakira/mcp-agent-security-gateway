name: One-time deterministic poster reconciliation
on:
  push:
    branches: [fix/evidence-provenance-20261114]
    paths: [.github/workflows/one-time-poster-reconcile.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Verify approved source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:poster/01_research_brief.md)" = "196a5a9070b9e6f0eae0a056e3fd0bf84ce3b21b"
          test "$(git rev-parse HEAD:poster/03_verified_metrics.md)" = "a2253687a9d8b0cb95a60c39277b7ade7eff1ab3"
          test "$(git rev-parse HEAD:poster/render_poster.py)" = "805f546851d5c57a3a646d7f13382c3dd101ec97"
          grep -q 'PRODUCTION NO-GO' poster/01_research_brief.md
          grep -q 'PRODUCTION NO-GO' poster/03_verified_metrics.md
      - name: Render static print frame, preserve animated source
        run: |
          set -euo pipefail
          POSTER_BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export POSTER_BROWSER
          python poster/render_poster.py
          test -s poster/poster_36x48.pdf
          test -s poster/poster.png
          cmp poster/poster_36x48.pdf MCP_Gateway_Poster.pdf
      - name: Validate PDF evidence and print output
        run: |
          python -m pip install --disable-pip-version-check 'PyMuPDF>=1.24,<2'
          python - <<'PY'
          import fitz
          with fitz.open("poster/poster_36x48.pdf") as doc:
              assert len(doc) == 1
              text = doc[0].get_text()
              for phrase in ("1,245", "1,246", "NO-GO", "Constrained MCP Agent-to-Tool"):
                  assert phrase in text, phrase
          PY
      - name: Commit only three poster binaries
        run: |
          set -euo pipefail
          git add -- poster/poster_36x48.pdf poster/poster.png MCP_Gateway_Poster.pdf
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(poster): regenerate static-print-frame binaries'
          git push origin HEAD:fix/evidence-provenance-20261114
