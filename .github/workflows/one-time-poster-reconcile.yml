# One-time operator-authorized reconciliation of the three reviewed poster binaries.
# Branch-limited, exact source SHA checked, and no force pushes.
name: One-time poster binary reconciliation
on:
  push:
    branches: [fix/evidence-provenance-20261114]
    paths: [.github/workflows/one-time-poster-reconcile.yml]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'poojakira/mcp-agent-security-gateway'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify approved source files and release language
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:poster/01_research_brief.md)" = 196a5a9070b9e6f0eae0a056e3fd0bf84ce3b21b
          test "$(git rev-parse HEAD:poster/03_verified_metrics.md)" = a2253687a9d8b0cb95a60c39277b7ade7eff1ab3
          test "$(git rev-parse HEAD:poster/render_poster.py)" = 3739edf6ccf6ab22c01896c3296b108f13de17ee
          grep -q 'PRODUCTION NO-GO' poster/01_research_brief.md
          grep -q 'PRODUCTION NO-GO' poster/03_verified_metrics.md
          git diff --exit-code
      - name: Regenerate exact-head poster binaries
        run: |
          set -euo pipefail
          POSTER_BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$POSTER_BROWSER"
          export POSTER_BROWSER
          python poster/render_poster.py
          test -s poster/poster_36x48.pdf
          test -s poster/poster.png
          test -s MCP_Gateway_Poster.pdf
          cmp poster/poster_36x48.pdf MCP_Gateway_Poster.pdf
      - name: Check evidence and poster content before commit
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          with fitz.open("poster/poster_36x48.pdf") as pdf:
              assert len(pdf) == 1
              text = "\n".join(p.get_text() for p in pdf)
              for phrase in ("1,245", "NO-GO", "1,246", "Constrained MCP Agent-to-Tool"):
                  assert phrase in text, phrase
          assert Path("poster/poster.png").stat().st_size > 10000
          PY
      - name: Commit only the reviewed three binaries
        run: |
          set -euo pipefail
          git add -- poster/poster_36x48.pdf poster/poster.png MCP_Gateway_Poster.pdf
          git diff --cached --name-only | grep -Ev '^(poster/poster_36x48.pdf|poster/poster.png|MCP_Gateway_Poster.pdf)$' && exit 1 || true
          if git diff --cached --quiet; then echo 'Already reconciled'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: reconcile reviewed exact-source poster binaries'
          git push origin HEAD:fix/evidence-provenance-20261114
