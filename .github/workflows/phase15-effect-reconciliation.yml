name: Phase 15 independent local-effect reconciliation

on:
  pull_request:
    branches:
      - phase14/real-mcp-execution-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install free local test dependencies
        run: python -m pip install -e ".[dev,oidc]"
      - name: Security module and test formatting
        run: |
          ruff check src/mcp_monitor/protocol/verified_effect_adapter.py tests/test_phase15_verified_effect_adapter.py
          ruff format --check src/mcp_monitor/protocol/verified_effect_adapter.py tests/test_phase15_verified_effect_adapter.py
      - name: Real SQLite commit, lost acknowledgement and independent reconciliation
        run: python -m pytest tests/test_phase15_verified_effect_adapter.py tests/test_phase11_effect_journal.py -q --tb=short
