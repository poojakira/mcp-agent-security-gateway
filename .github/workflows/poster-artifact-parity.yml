name: Poster Artifact Parity

on:
  pull_request:
    branches: [main]
    paths:
      - "poster/**"
      - "MCP_Gateway_Poster.pdf"
      - ".github/workflows/poster-artifact-parity.yml"
  push:
    branches: [main]
    paths:
      - "poster/**"
      - "MCP_Gateway_Poster.pdf"
      - ".github/workflows/poster-artifact-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned offline render dependencies
        run: python -m pip install --disable-pip-version-check reportlab==4.4.9 PyMuPDF==1.26.6
      - name: Check stale or missing PDF regressions
        run: python poster/test_artifact_integrity.py
      - name: Render reviewed claims and validate tracked PDF and PNG
        run: |
          python poster/render_poster.py
          python poster/verify_artifacts.py
