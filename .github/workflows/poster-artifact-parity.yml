# Render poster from source on the exact review commit using free local Chromium.
# No GitHub write token, provider API key, or paid renderer is required.
# Binary outputs are review artifacts; never silently overwrite a source branch.
name: Poster Artifact Parity

on:
  push:
    branches:
      - docs/phase1-16-evidence-and-poster-20261111
      - security/phase1-16-audit
      - fix/evidence-provenance-20261114
      - integration/phase1-16-verified
  pull_request:
    branches: [main]
    paths:
      - "poster/01_research_brief.md"
      - "poster/02_claim_ledger.md"
      - "poster/03_verified_metrics.md"
      - "poster/evidence_manifest.json"
      - ".github/workflows/poster-artifact-parity.yml"
      - "poster/13_reproducibility.md"
      - "poster/render_poster.py"
      - "docs/poster/mcp-gateway-animated-architecture.svg"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify provenance manifest against actual successful GitHub runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          m = json.loads(Path("poster/evidence_manifest.json").read_text())
          assert m["schema_version"] == 1 and m["decision"] == "NO-GO"
          sha = m["source_sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)
          assert isinstance(m["tests_passed_per_python"], int) and m["tests_passed_per_python"] > 0
          assert isinstance(m["tests_skipped_per_python"], int) and m["tests_skipped_per_python"] >= 0
          assert isinstance(m["integrated_jobs_total"], int) and m["integrated_jobs_total"] > 0
          assert m["integrated_jobs_passed"] == m["integrated_jobs_total"]
          assert m["coverage_percent"] is None
          def get_run(run_id):
              url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs/{run_id}"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "User-Agent": "poster-provenance-check"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          for key, expected_name in (("integrated_run_id", "Phase 1-16 integrated security candidate"), ("poster_run_id", "Poster Artifact Parity")):
              run = get_run(m[key])
              assert run["head_sha"] == sha, (key, run["head_sha"], sha)
              assert run["status"] == "completed" and run["conclusion"] == "success", key
              assert run["name"] == expected_name, (key, run["name"])
          for path in ("poster/01_research_brief.md", "poster/02_claim_ledger.md", "poster/03_verified_metrics.md"):
              content = Path(path).read_text()
              assert "NO-GO" in content and sha in content
              assert str(m["integrated_run_id"]) in content and str(m["poster_run_id"]) in content
          print(f"Verified historical poster evidence for {sha}; current checkout is not automatically certified")
          PY
      - name: Independently reconcile historical test totals from CI logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import io, json, os, re, urllib.request, zipfile
          from pathlib import Path
          m = json.loads(Path("poster/evidence_manifest.json").read_text())
          base = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}"
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "User-Agent": "poster-evidence-reconciler"}
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                  return response.read()
          jobs = json.loads(fetch(f"{base}/actions/runs/{m['integrated_run_id']}/jobs?per_page=100"))["jobs"]
          assert len(jobs) == m["integrated_jobs_total"], "Unexpected job count or paginated job listing"
          assert all(j["conclusion"] == "success" for j in jobs), "A historical job was not successful"
          matrix = {j["name"]: j for j in jobs if j["name"].startswith("integrated-regression (")}
          assert set(matrix) == {f"integrated-regression ({v})" for v in m["python_versions"]}, matrix.keys()
          raw = fetch(f"{base}/actions/runs/{m['integrated_run_id']}/logs")
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              logs = {name: archive.read(name).decode("utf-8", errors="replace") for name in archive.namelist() if name.endswith(".txt")}
          for name, job in matrix.items():
              job_logs = "\n".join(value for path, value in logs.items() if name in path or str(job["id"]) in path)
              assert job_logs, f"Missing downloadable log for {name}"
              counts = re.findall(r"(\d+) passed, (\d+) skipped in [^\n]+", job_logs)
              assert counts, f"No pytest summary found in {name}"
              actual = tuple(map(int, counts[-1]))
              expected = (m["tests_passed_per_python"], m["tests_skipped_per_python"])
              assert actual == expected, f"{name}: observed {actual}, manifest {expected}"
              print(f"Verified {name}: {actual[0]} passed, {actual[1]} skipped")
          PY
      - name: Render 36x48 PDF and PNG without APIs or paid services
        run: |
          set -euo pipefail
          POSTER_BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$POSTER_BROWSER"
          export POSTER_BROWSER
          python poster/render_poster.py
          test -s poster/poster_36x48.pdf
          test -s poster/poster.png
          test -s MCP_Gateway_Poster.pdf
      - name: Validate poster page dimensions and visible evidence
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF Pillow
          python - <<'PY'
          import fitz
          from pathlib import Path
          p = fitz.open("poster/poster_36x48.pdf")
          assert len(p) == 1
          page = p[0]
          assert abs(page.rect.width - 2592) < 2 and abs(page.rect.height - 3456) < 2
          text = page.get_text()
          import json
          manifest = json.loads(Path("poster/evidence_manifest.json").read_text())
          for phrase in (f"{manifest['tests_passed_per_python']:,}", "NO-GO", "Docker"):
              assert phrase in text, (phrase, text[:350])
          assert Path("poster/poster.png").stat().st_size > 10000
          assert Path("docs/poster/mcp-gateway-animated-architecture.svg").exists()
          print("Poster dimension, content and PNG checks passed")
          PY
      - name: Diagnose poster content drift independently of PDF metadata
        run: |
          python - <<'PY'
          import hashlib
          import difflib
          import subprocess
          import tempfile
          from pathlib import Path
          import fitz

          def committed(path):
              return subprocess.run(
                  ["git", "show", f"HEAD:{path}"],
                  capture_output=True, check=True,
              ).stdout

          for path in ("poster/poster_36x48.pdf", "MCP_Gateway_Poster.pdf"):
              current = Path(path).read_bytes()
              original = committed(path)
              with fitz.open(stream=current, filetype="pdf") as fresh, fitz.open(
                  stream=original, filetype="pdf"
              ) as prior:
                  same_pages = len(fresh) == len(prior)
                  same_text = same_pages and all(
                      fresh[i].get_text() == prior[i].get_text()
                      for i in range(len(fresh))
                  )
                  same_pixels = same_pages and all(
                      hashlib.sha256(fresh[i].get_pixmap(matrix=fitz.Matrix(0.5, 0.5), alpha=False).samples).digest()
                      == hashlib.sha256(prior[i].get_pixmap(matrix=fitz.Matrix(0.5, 0.5), alpha=False).samples).digest()
                      for i in range(len(fresh))
                  )
                  print(f"{path}: pages_equal={same_pages} text_equal={same_text} raster_equal={same_pixels}", flush=True)
                  print(f"{path}: committed_metadata={prior.metadata} rendered_metadata={fresh.metadata}", flush=True)
                  if not same_text:
                      old_lines = "\\n".join(page.get_text() for page in prior).splitlines()
                      new_lines = "\\n".join(page.get_text() for page in fresh).splitlines()
                      diff = list(difflib.unified_diff(
                          old_lines, new_lines,
                          fromfile=f"committed/{path}",
                          tofile=f"rendered/{path}",
                          lineterm="",
                      ))
                      print(f"{path}: extracted_text_diff_lines={len(diff)}", flush=True)
                      print("\\n".join(diff[:100]), flush=True)
          try:
              from PIL import Image, ImageChops
              with tempfile.TemporaryDirectory() as temp:
                  previous = Path(temp) / "committed.png"
                  previous.write_bytes(committed("poster/poster.png"))
                  with Image.open(previous) as prior, Image.open("poster/poster.png") as fresh:
                      same_size = prior.size == fresh.size
                      same_pixels = same_size and ImageChops.difference(
                          prior.convert("RGBA"), fresh.convert("RGBA")
                      ).getbbox() is None
                      print(f"poster/poster.png: size_equal={same_size} pixels_equal={same_pixels}", flush=True)
          except ImportError:
              print("Pillow not installed: PNG pixel comparison unavailable", flush=True)
          PY
      - name: Verify committed poster content and rendered pixels against exact-head render
        # Chromium embeds timestamps and version-dependent PDF metadata. Compare
        # the actual PDF text, page geometry and raster pixels, plus exact PNG
        # bytes; do not silently accept content or visual changes.
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          import fitz

          def committed(path):
              return subprocess.run(
                  ["git", "show", f"HEAD:{path}"],
                  capture_output=True, check=True,
              ).stdout

          png_path = "poster/poster.png"
          assert Path(png_path).read_bytes() == committed(png_path), (
              "PNG differs from committed artifact; regenerate and review"
          )
          print("PNG exact-byte parity passed", flush=True)

          pdf_paths = ("poster/poster_36x48.pdf", "MCP_Gateway_Poster.pdf")
          assert Path(pdf_paths[0]).read_bytes() == Path(pdf_paths[1]).read_bytes(), (
              "Generated PDF copies differ"
          )
          for path in pdf_paths:
              with fitz.open(path) as fresh, fitz.open(
                  stream=committed(path), filetype="pdf"
              ) as prior:
                  assert len(fresh) == len(prior) == 1, f"{path}: page count changed"
                  for i in range(len(fresh)):
                      a, b = fresh[i], prior[i]
                      assert tuple(a.rect) == tuple(b.rect), f"{path}: page dimensions changed"
                      assert a.get_text() == b.get_text(), f"{path}: extracted text changed"
                      for zoom in (0.5, 1.0):
                          matrix = fitz.Matrix(zoom, zoom)
                          ar = a.get_pixmap(matrix=matrix, alpha=False)
                          br = b.get_pixmap(matrix=matrix, alpha=False)
                          assert (ar.width, ar.height) == (br.width, br.height), (
                              f"{path}: raster dimensions changed"
                          )
                          assert hashlib.sha256(ar.samples).digest() == hashlib.sha256(
                              br.samples
                          ).digest(), f"{path}: raster pixels changed at {zoom}x"
              print(f"{path}: text, dimensions and two-scale raster parity passed", flush=True)
          PY
      - name: Store rendered posterior artifacts for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-head-poster-36x48
          path: |
            poster/poster_36x48.pdf
            poster/poster.png
            MCP_Gateway_Poster.pdf
          if-no-files-found: error
          retention-days: 7
