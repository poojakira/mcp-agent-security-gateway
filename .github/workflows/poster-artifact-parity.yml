# Render poster from source on the exact review commit using free local Chromium.
# No GitHub write token, provider API key, or paid renderer is required.
# Binary outputs are review artifacts; never silently overwrite a source branch.
name: Poster Artifact Parity

on:
  push:
    branches:
      - docs/phase1-16-evidence-and-poster-20261111
  pull_request:
    branches: [main]
    paths:
      - "poster/01_research_brief.md"
      - "poster/02_claim_ledger.md"
      - "poster/03_verified_metrics.md"
      - "poster/13_reproducibility.md"
      - "poster/render_poster.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source commit (read-only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify source distinguishes CI from release
        run: |
          python - <<'PY'
          from pathlib import Path
          brief = Path("poster/01_research_brief.md").read_text()
          metrics = Path("poster/03_verified_metrics.md").read_text()
          ledger = Path("poster/02_claim_ledger.md").read_text()
          for content in (brief, metrics, ledger):
              assert "NO-GO" in content
              assert "43a72c8984bf9a472b9055d4f9e84cc759f61718" in content
          print("Poster source provenance and NO-GO assertions verified")
          PY
      - name: Render 36x48 PDF and PNG without APIs or paid services
        run: |
          set -euo pipefail
          POSTER_BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$POSTER_BROWSER"
          export POSTER_BROWSER
          python poster/render_poster.py
          test -s poster/poster_36x48.pdf
          test -s poster/poster.png
          test -s MCP_Gateway_Poster.pdf
      - name: Validate poster page dimensions and visible evidence
        run: |
          python -m pip install --disable-pip-version-check PyMuPDF
          python - <<'PY'
          import fitz
          from pathlib import Path
          p = fitz.open("poster/poster_36x48.pdf")
          assert len(p) == 1
          page = p[0]
          assert abs(page.rect.width - 2592) < 2 and abs(page.rect.height - 3456) < 2
          text = page.get_text()
          for phrase in ("1,211", "NO-GO", "Docker"):
              assert phrase in text, (phrase, text[:350])
          assert Path("poster/poster.png").stat().st_size > 10000
          print("Poster dimension, content and PNG checks passed")
          PY
      - name: Store rendered posterior artifacts for visual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exact-head-poster-36x48
          path: |
            poster/poster_36x48.pdf
            poster/poster.png
            MCP_Gateway_Poster.pdf
          if-no-files-found: error
          retention-days: 7
