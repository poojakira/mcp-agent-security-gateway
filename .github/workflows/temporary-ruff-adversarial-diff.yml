name: Temporary Ruff Adversarial Diff
on:
  push:
    branches: [fix/enforce-policy-in-stdio-proxy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.8.4
      - name: Print precise formatter diff
        run: ruff format --diff tests/test_stdio_adversarial_responses.py
