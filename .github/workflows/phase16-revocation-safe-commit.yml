name: Phase 16 revocation-safe MCP commit fence

on:
  push:
    branches:
      - phase16/revocation-safe-commit-fence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revocation-fence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install free local dependencies, no API keys
        run: python -m pip install -e ".[dev,oidc]"
      - name: Static checks
        run: |
          ruff check src/mcp_monitor/protocol/revocation_fence.py src/mcp_monitor/protected_repo_server.py tests/test_phase16_revocation_safe_commit.py
          ruff format --check src/mcp_monitor/protocol/revocation_fence.py src/mcp_monitor/protected_repo_server.py tests/test_phase16_revocation_safe_commit.py
      - name: Revocation boundary, real MCP adapter and crash-journal tests
        run: |
          python -m pytest tests/test_phase16_revocation_safe_commit.py tests/test_first_party_protected_mcp.py tests/test_phase15_consequence_verification.py tests/test_phase11_effect_journal.py -q --tb=short
