name: Phase 10 MCP Multiplexing and Cancellation

on:
  pull_request:
    branches:
      - phase9/internal-egress-network-pilot
    paths:
      - "src/mcp_monitor/protocol/multiplex.py"
      - "src/mcp_monitor/proxy/stdio_proxy.py"
      - "tests/test_phase10_multiplex.py"
      - ".github/workflows/phase10-multiplex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-regressions:
    name: Concurrent MCP protocol (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install free open-source dependencies
        run: python -m pip install -e ".[dev,oidc]"
      - name: Show formatter differences (temporary)
        run: |
          ruff format --diff src/mcp_monitor/protocol/multiplex.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase10_multiplex.py || true
      - name: Ruff protocol lint and formatting
        run: |
          ruff check src/mcp_monitor/protocol/multiplex.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase10_multiplex.py
          ruff format --check src/mcp_monitor/protocol/multiplex.py src/mcp_monitor/proxy/stdio_proxy.py tests/test_phase10_multiplex.py
      - name: Focused protocol and prior boundary regressions
        run: python -m pytest tests/test_phase10_multiplex.py tests/test_step4_protocol_resilience.py tests/test_stdio_adversarial_responses.py -q --tb=short
      - name: Complete repository regression suite
        run: python -m pytest tests/ -q --tb=short --cov=mcp_monitor --cov-report=term --cov-fail-under=77
