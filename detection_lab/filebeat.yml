# Filebeat configuration for MCP Gateway Detection Lab
# Ships NDJSON security events from the gateway to Elasticsearch

filebeat.inputs:
  - type: log
    id: mcp-gateway-events
    enabled: true
    paths:
      - /var/log/mcp-gateway/events.ndjson
    json:
      keys_under_root: true
      overwrite_keys: true
      add_error_key: true
      expand_keys: true
    fields:
      event.module: mcp_security_gateway
      event.dataset: mcp.security
    fields_under_root: true

processors:
  - timestamp:
      field: "@timestamp"
      layouts:
        - "2006-01-02T15:04:05.999999999Z07:00"
      test:
        - "2026-08-27T12:00:00.000000Z"
  - drop_fields:
      fields: ["agent", "ecs", "host", "input", "log"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "mcp-security-events"

# Lab configuration: disable Filebeat's index-template and ILM management.
# Elasticsearch auto-creates the "mcp-security-events" data stream on first
# write. This keeps the lab simple and avoids template-provisioning errors.
# For a production deployment you would define an explicit index template
# and ILM policy. Verified end-to-end on Docker Desktop 29.x (events queryable
# via GET /mcp-security-events*/_count).
setup:
  ilm:
    enabled: false
  template:
    enabled: false

logging:
  level: warning
  to_files: false
