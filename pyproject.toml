[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-gateway-monitor"
version = "0.1.0"
description = "Stdlib-first MCP tool-call security monitor and gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Pooja Kiran" }]
dependencies = []

[project.scripts]
mcp-gateway = "mcp_monitor.production.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "ruff==0.8.4",
]
ml = ["scikit-learn>=1.4"]
dpi = ["mitmproxy>=10"]
attack = ["attack-v19-core>=19.1,<20"]
server = ["fastapi>=0.100", "uvicorn[standard]>=0.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:asyncio"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["N803", "N806", "E501", "B007"]
