[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-gateway-monitor"
version = "0.1.0"
description = "Security monitor for MCP tool calls with detector orchestration and immutable audit logging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0.0,<43",
    "structlog>=24.1.0,<25",
    "python-json-logger>=2.0.0,<3",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.8",
    "pre-commit>=3.7",
    "sphinx>=7.3",
    "sphinx-rtd-theme>=2.0",
]
ml = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]
dpi = [
    "mitmproxy>=9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"
tag_regex = "^v?(\\d+\\.\\d+\\.\\d+)$"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config --cov=mcp_monitor --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security-focused tests",
    "slow: Slow tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TRY", # tryceratops
    "ERA", # eradicate
    "PL",  # pylint
    "Q",   # pyflakes-quotes
]
ignore = [
    "S101", # assert used in test code
    "T201", # print in test code
    "ARG001", # unused argument in test fixtures
    "ARG002", # unused argument in test fixtures
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["mcp_monitor"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
enable_error_code = ["ignore-without-code"]
exclude = [
    ".venv",
    "dist",
    "build",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.mypy.overrides]
module = [
    "tests.*",
]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.bandit]
targets = ["src"]
exclude = ["tests"]
skips = ["B101", "B601"]
severity_level = "medium"
confidence_level = "medium"

[tool.coverage.run]
source = ["src/mcp_monitor"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*_test.py",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pytest-cov]
cov-fail-under = 80